[project]
name = "mini-harness"
version = "0.1.0"
description = "Personal experimental agent harness MVP (headless CLI)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.scripts]
minihns = "mini_harness.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_harness"]

[dependency-groups]
dev = [
    "coverage>=7.16",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.1",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# 本项目的 docstring / 注释 / 面向用户的字符串一律用中文全角标点（见 AGENTS.md 与 docs/）。
# RUF001/RUF002/RUF003 把「：，；（）」当成「可疑的 ASCII 近似字符」报警，与这条成文规范冲突；
# 其中 SYSTEM_PROMPT 与 `未注册的工具：read` 这类字符串还是规格里的字面量，改标点就是改行为。
# 用 allowed-confusables 只放行这五个字符，其余可疑字符仍然照报。
allowed-confusables = ["：", "，", "；", "（", "）"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `tests/fixtures/` 是数据与只读 fixture 仓库，不是测试：`tests/fixtures/repo` 里那条必然失败的
# 哨兵用例一旦被主套件收集，主套件立刻变红。它只能被显式调用（`pytest tests/fixtures/repo`）。
# 覆盖率不在这里出报告：pytest-cov 在 `coverage combine` 之前报告，看不见子进程的数据。
# 门禁的三步是 `coverage run -m pytest` → `coverage combine` → `coverage report --fail-under`。
norecursedirs = ["fixtures"]

# seam ⑥ 的 CLI 测试是真实子进程，每个子进程各写一份 partial 数据文件（见 tests/cli_blackbox.py），
# 所以 source 明写包名、parallel 常开。
[tool.coverage.run]
source = ["mini_harness"]
parallel = true

# 覆盖率地板：combine 后实测 95.62%（457 条语句 / 20 条未覆盖），地板定在 95，略低于实测、当前可达。
# 未覆盖集中在 `cli/main.py`（96%：57-59、182、214）、`events/reader.py`（85%）、`loop/turn_loop.py`（90%）。
# 跑法三步：`coverage run -m pytest` → `coverage combine` → `coverage report --fail-under=95 --show-missing`。
[tool.coverage.report]
fail_under = 95
