[project]
name = "mini-harness"
version = "0.1.0"
description = "Personal experimental agent harness MVP (headless CLI)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.scripts]
minihns = "mini_harness.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_harness"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# 本项目的 docstring / 注释 / 面向用户的字符串一律用中文全角标点（见 AGENTS.md 与 docs/）。
# RUF001/RUF002/RUF003 把「：，；（）」当成「可疑的 ASCII 近似字符」报警，与这条成文规范冲突；
# 其中 SYSTEM_PROMPT 与 `未注册的工具：read` 这类字符串还是规格里的字面量，改标点就是改行为。
# 用 allowed-confusables 只放行这五个字符，其余可疑字符仍然照报。
allowed-confusables = ["：", "，", "；", "（", "）"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=mini_harness --cov-report=term-missing"

# 覆盖率地板：实测 76%（457 条语句 / 108 条未覆盖），地板定在 75，略低于实测、当前可达。
# 地板低的主要是 `cli/main.py`（36%）：seam ⑥ 的 CLI 测试是 subprocess 黑盒，跑在子进程里，
# 不计进这次进程内的覆盖率。要抬地板先解决「子进程也记账」，不要靠补低价值测试凑数。
[tool.coverage.report]
fail_under = 75
