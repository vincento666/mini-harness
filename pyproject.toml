[project]
name = "mini-harness"
version = "0.1.0"
description = "Personal experimental agent harness MVP (headless CLI)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.scripts]
minihns = "mini_harness.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_harness"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
